<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recetas</title>
    <link rel="stylesheet" th:href="@{/css/recetas.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="contenido">

        <div class="cabecera-recetas">
            <h1>Recetas</h1>
            <a th:href="@{/recetas/nueva}" class="btn-nueva">+ Nueva receta</a>
        </div>
        <!-- filtros -->
        <div class="filtros">

            <!-- ranking -->
            <form th:action="@{/recetas}" method="get" class="form-filtro">
                <select name="rankingId">
                    <option value="">Todos los rankings</option>
                    <option th:each="r : ${rankings}"
                            th:value="${r.id}"
                            th:text="${r.rankingName}"
                            th:selected="${r.id == rankingId}">
                        Ranking
                    </option>
                </select>
                <button type="submit">Filtrar</button>
            </form>

            <!-- nombre -->
            <form th:action="@{/recetas}" method="get" class="form-filtro">
                <input type="text" name="nombre" placeholder="Buscar por nombre..."
                       th:value="${nombre}">
                <button type="submit">Buscar</button>
            </form>

        </div>

        <!-- recetas -->
        <div class="lista-recetas">
            <div class="receta-card" th:each="receta : ${recetas}">
                <div class="receta-info">
                    <h3 th:text="${receta.recetaNombre}">Nombre receta</h3>
                    <p th:text="${receta.usuario.username}">usuario</p>
                    <span class="badge" th:text="${receta.ranking.rankingName}">ranking</span>
                    <span class="badge dificultad-badge" th:if="${dificultades[receta.id] != null}" th:text="${dificultades[receta.id]}">dificultad</span>
                </div>
                <a th:href="@{/recetas/{id}(id=${receta.id})}" class="btn-ver">Ver receta</a>
            </div>

            <p th:if="${#lists.isEmpty(recetas)}">No se encontraron recetas.</p>
        </div>

    </div>

    <div th:replace="~{navbar :: footer}"></div>

</body>
</html>
