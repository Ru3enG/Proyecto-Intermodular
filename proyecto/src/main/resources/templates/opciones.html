<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opciones</title>
    <link rel="stylesheet" th:href="@{/css/opciones.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="contenido">

        <h1>Opciones</h1>

        <p class="exito" th:if="${param.ok}">Contraseña cambiada correctamente</p>

        <!-- DATOS DEL USUARIO -->
        <div class="seccion">
            <h2>Mis datos</h2>
            <p><strong>Usuario:</strong> <span th:text="${usuario.username}">username</span></p>
            <p><strong>Email:</strong> <span th:text="${usuario.email}">email</span></p>
            <p><strong>Fecha de nacimiento:</strong> <span th:text="${usuario.fechaNacimiento}">fecha</span></p>
        </div>

        <!-- CAMBIAR CONTRASEÑA -->
        <div class="seccion">
            <h2>Cambiar contraseña</h2>

            <p class="error" th:if="${error}" th:text="${error}">Error</p>

            <form th:action="@{/opciones/cambiarPassword}" method="post">
                <label>Contraseña actual</label>
                <input type="password" name="passwordActual" required>

                <label>Contraseña nueva</label>
                <input type="password" name="passwordNueva" required>

                <button type="submit">Cambiar contraseña</button>
            </form>
        </div>

        <!-- MIS RECETAS -->
        <div class="seccion">
            <h2>Mis recetas</h2>

            <div class="lista-recetas-opciones">
                <div class="receta-card-pequeña" th:each="receta : ${recetas}">
                    <div class="receta-info">
                        <h3 th:text="${receta.recetaNombre}">Nombre</h3>
                        <span class="badge" th:text="${receta.ranking.rankingName}">ranking</span>
                    </div>
                    <div class="receta-acciones">
                        <a th:href="@{/recetas/{id}(id=${receta.id})}" class="btn-ver">Ver</a>
                        <form th:action="@{/recetas/eliminar/{id}(id=${receta.id})}" method="post">
                            <button type="submit" class="btn-eliminar">Eliminar</button>
                        </form>
                    </div>
                </div>

                <p th:if="${#lists.isEmpty(recetas)}">No has creado ninguna receta todavía.</p>
            </div>

            <a th:href="@{/recetas/nueva}" class="btn-nueva">+ Nueva receta</a>
        </div>

        <!-- CERRAR SESION -->
        <div class="seccion seccion-logout">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>

    </div>

    <div th:replace="~{navbar :: footer}"></div>

</body>
</html>
