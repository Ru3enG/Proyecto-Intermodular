<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${receta.recetaNombre}">Detalle receta</title>
    <link rel="stylesheet" th:href="@{/css/recetas.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="contenido">
        <!-- detalles -->
        <h1 th:text="${receta.recetaNombre}">Nombre receta</h1>

        <div class="meta-receta">
            <p class="autor">Receta de <strong th:text="${receta.usuario.username}">usuario</strong></p>
            <span class="badge" th:text="${receta.ranking.rankingName}">ranking</span>
            <span class="badge dificultad-badge" th:if="${dificultadMedia != null}" th:text="'Dificultad: ' + ${dificultadMedia}">dificultad</span>
        </div>

        <div th:if="${receta.imagenUrl != null}" class="seccion imagen-receta">
            <img th:src="${receta.imagenUrl}" alt="Imagen de la receta">
        </div>

        <div class="seccion">
            <h2>Ingredientes</h2>
            <p th:text="${receta.ingredientes}" class="texto-pre">ingredientes</p>
        </div>

        <div class="seccion">
            <h2>Pasos a seguir</h2>
            <p th:text="${receta.pasos}" class="texto-pre">pasos</p>
        </div>

        <!-- puntuar si no eres el creador-->
        <div class="seccion" th:if="${!esAutor}">
            <h2>Puntuar receta</h2>
            <div th:if="${yaVoto}">
                <p class="exito">Ya has puntuado esta receta</p>
            </div>
            <div th:if="${!yaVoto}">
                <form th:action="@{/recetas/{id}/puntuar(id=${receta.id})}" method="post">
                    <label>Puntuación (1-10)</label>
                    <input type="number" name="puntos" min="1" max="10" required>
                    <button type="submit">Puntuar</button>
                </form>
            </div>
        </div>

        <!-- votar dificultad si no eres el creador -->
        <div class="seccion" th:if="${!esAutor}">
            <h2>Dificultad de la receta</h2>
            <div th:if="${yaVotoDificultad}">
                <p class="exito">Ya has valorado la dificultad</p>
            </div>
            <div th:if="${!yaVotoDificultad}">
                <form th:action="@{/recetas/{id}/dificultad(id=${receta.id})}" method="post">
                    <label>¿Qué dificultad le pones?</label>
                    <select name="dificultad" required>
                        <option value="1">Muy Fácil</option>
                        <option value="2">Fácil</option>
                        <option value="3">Normal</option>
                        <option value="4">Complicada</option>
                        <option value="5">Muy Complicada</option>
                    </select>
                    <button type="submit">Valorar dificultad</button>
                </form>
            </div>
        </div>

        <!-- comentarios -->
        <div class="seccion">
            <h2>Comentarios</h2>
            <div class="lista-comentarios">
                <div class="comentario" th:each="c : ${comentarios}">
                    <span class="comentario-usuario" th:text="${c.usuario.username}">usuario</span>
                    <p class="comentario-texto" th:text="${c.texto}">texto</p>
                </div>
                <p th:if="${#lists.isEmpty(comentarios)}">No hay comentarios todavía.</p>
            </div>
            <form th:action="@{/recetas/{id}/comentar(id=${receta.id})}" method="post" class="form-comentario">
                <textarea name="texto" rows="3" placeholder="Escribe un comentario" maxlength="500" required></textarea>
                <button type="submit">Comentar</button>
            </form>
        </div>

    </div>

    <div th:replace="~{navbar :: footer}"></div>

</body>
</html>
