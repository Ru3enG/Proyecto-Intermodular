<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

    <div class="registro-wrapper">

        <div class="logo-box">
            <img th:src="@{/images/logoPrincipal.png}" alt="Logo" class="logo-img">
        </div>

        <div class="registro-card">
            <h2>Crear cuenta</h2>

            <form th:action="@{/registro}" method="post" th:object="${u}">

                <label>Usuario</label>
                <input type="text" th:field="*{username}" required>

                <label>Email</label>
                <input type="email" th:field="*{email}" required>

                <label>Contraseña</label>
                <input type="password" th:field="*{password}" required>

                <label>Fecha de nacimiento</label>
                <input type="date" th:field="*{fechaNacimiento}" required>

                <button type="submit">Registrarse</button>
            </form>

            <p class="login-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
        </div>

    </div>

    <div th:replace="~{navbar :: footer}"></div>

</body>
</html>
