<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Principal</title>
    <link rel="stylesheet" th:href="@{/css/principal.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="contenido">

        <h1>Rankings</h1>

        <div th:if="${not #lists.isEmpty(rankings)}">

            <div class="pergamino-wrapper">

                <!-- flecha ranking anterior (izquierda) -->
                <a class="flecha flecha-lateral" th:data-href="@{/principal(idx=${indiceAnterior}, pagina=0)}">&#8592;</a>

                <img th:src="@{/images/cuchara.png}" class="utensilio" alt="cuchara">

                <div class="columna-central">

                    <!-- flecha pagina anterior (arriba) -->
                    <a class="flecha flecha-vertical"
                       th:classappend="${totalPaginas == 1} ? 'oculta'"
                       th:data-href="@{/principal(idx=${indiceActual}, pagina=${paginaAnterior})}">&#8593;</a>

                    <!-- pergamino -->
                    <div class="pergamino" id="pergamino">
                        <table class="ranking-tabla">
                            <thead>
                                <tr>
                                    <td colspan="3" class="titulo-ranking"
                                        th:text="${rankings[indiceActual].rankingName}">Nombre</td>
                                </tr>
                                <tr>
                                    <th>Posición</th>
                                    <th>Usuario</th>
                                    <th>Puntuación</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pos, j : ${posiciones}">
                                    <td th:text="${offset + j.count}">1</td>
                                    <td th:text="${pos.usuario.username}">usuario</td>
                                    <td th:text="${pos.puntuacion}">0</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(posiciones)}">
                                    <td colspan="3">No hay jugadores todavía</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- flecha pagina siguiente (abajo) -->
                    <a class="flecha flecha-vertical"
                       th:classappend="${totalPaginas == 1} ? 'oculta'"
                       th:data-href="@{/principal(idx=${indiceActual}, pagina=${paginaSiguiente})}">&#8595;</a>

                </div>

                <img th:src="@{/images/tenedor.png}" class="utensilio" alt="tenedor">

                <!-- flecha ranking siguiente (derecha) -->
                <a class="flecha flecha-lateral" th:data-href="@{/principal(idx=${indiceSiguiente}, pagina=0)}">&#8594;</a>

            </div>

        </div>
    </div>

    <div th:replace="~{navbar :: footer}"></div>

    <script>
        // animacion de enrollar y desenrollar el pergamino al cambiar
        document.querySelectorAll('.flecha').forEach(function(flecha) {
            flecha.addEventListener('click', function(e) {
                e.preventDefault();
                var url = this.getAttribute('data-href');
                var pergamino = document.getElementById('pergamino');

                // animacion de cierre
                pergamino.classList.add('enrollando');

                // cuando termina la animacion navegamos a la url
                setTimeout(function() {
                    window.location.href = url;
                }, 800);
            });
        });

        // animacion de apertura al cargar la pagina
        window.addEventListener('load', function() {
            var pergamino = document.getElementById('pergamino');
            pergamino.classList.add('desenrollando');
        });
    </script>

</body>
</html>
